name: Dev container

on:
  pull_request:
    paths: [".devcontainer/**", "pyproject.toml", "poetry.lock"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dev container and run checks inside it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Third-party action: pinned to a commit SHA, unlike the first-party actions/* and github/* tags.
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: poetry run poe check && poetry run poe test-unit
