name: Dev container

on:
  pull_request:
    paths: [".devcontainer/**", "pyproject.toml", "poetry.lock"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dev container and run checks inside it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: poetry run poe check && poetry run poe test-unit
