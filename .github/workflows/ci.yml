name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, type-check, traceability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Ruff, format check, mypy, requirement traceability
        run: poetry run poe check

  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - uses: ./.github/actions/setup
      - name: zizmor
        run: poetry run zizmor --format=github .github

  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit and property-based tests
        env:
          TEST_SUMMARY_TITLE: Unit tests (Python ${{ matrix.python-version }})
        run: >-
          poetry run poe test-unit
          --junitxml=reports/junit.xml
          --html=reports/unit-report.html --self-contained-html
          --cov-report=term-missing --cov-report=xml:reports/coverage.xml

      - name: Add coverage to job summary
        if: always()
        run: |
          echo "#### Coverage (Python $PYTHON_VERSION)" >> "$GITHUB_STEP_SUMMARY"
          poetry run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-reports-py${{ matrix.python-version }}
          path: reports/
          retention-days: 14

  mutation:
    name: Mutation testing (core/)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run mutmut and enforce the minimum score
        run: poetry run poe mutation

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: pip-audit (known vulnerabilities in installed packages)
        run: poetry run poe audit
      - name: Dependency review (new vulnerable or disallowed dependencies in this PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
