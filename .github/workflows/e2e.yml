name: E2E tests

run-name: E2E ${{ inputs.suite || 'regression' }} on ${{ inputs.environment || 'dev' }} (${{ inputs.browser || 'chromium' }})

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test set. "custom" uses the marker expression below; "all" runs everything under target.
        type: choice
        default: regression
        options: [regression, smoke, api, ui, all, custom]
      marker:
        description: Marker expression for suite=custom, e.g. "api and not smoke".
        type: string
        default: ""
      target:
        description: Path, file or node id, e.g. test_scripts/api/test_identity.py::test_identity_endpoint_echoes_token_claims
        type: string
        default: test_scripts
      environment:
        description: GitHub environment that holds the test variables and secrets.
        type: choice
        default: dev
        options: [dev]
      workers:
        description: pytest-xdist workers ("auto", a number, or 0 to disable).
        type: string
        default: auto
      browser:
        description: Browser engine for UI tests; "all" runs one job per engine.
        type: choice
        default: chromium
        options: [chromium, firefox, webkit, all]
      reruns:
        description: Reruns for failed tests. Tests that pass on a rerun are listed as flaky in the summary.
        type: string
        default: "2"
      publish_history:
        description: Publish the HTML report and update the run history on GitHub Pages.
        type: boolean
        default: true
  # Nightly regression, Monday to Friday, 03:00 UTC. Disabled for the demo project; uncomment to enable.
  # schedule:
  #   - cron: "0 3 * * 1-5"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E ${{ inputs.suite || 'regression' }} (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browser == 'all' && '["chromium","firefox","webkit"]' || format('["{0}"]', inputs.browser || 'chromium')) }}
    # Use the environment's vars/secrets without creating a deployment record.
    environment:
      name: ${{ inputs.environment || 'dev' }}
      deployment: false
    # Inputs reach the shell only through env vars, never via ${{ }} inside run:, to prevent script injection.
    env:
      SUITE: ${{ inputs.suite || 'regression' }}
      MARKER: ${{ inputs.marker }}
      TARGET: ${{ inputs.target || 'test_scripts' }}
      WORKERS: ${{ inputs.workers || 'auto' }}
      RERUNS: ${{ inputs.reruns || '2' }}
      BROWSER: ${{ matrix.browser }}
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browser }}

      - name: Run tests (blocking, quarantined tests excluded)
        # Framework settings from the GitHub environment: non-secret values in vars, credentials in secrets.
        env: &framework-settings
          ENV_NAME: ${{ vars.ENV_NAME }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          UI_BASE_URL: ${{ vars.UI_BASE_URL }}
          OAUTH_TOKEN_URL: ${{ vars.OAUTH_TOKEN_URL }}
          OAUTH_CLIENT_NAME_A: ${{ vars.OAUTH_CLIENT_NAME_A }}
          OAUTH_CLIENT_ID_A: ${{ vars.OAUTH_CLIENT_ID_A }}
          OAUTH_CLIENT_SECRET_A: ${{ secrets.OAUTH_CLIENT_SECRET_A }}
          OAUTH_SCOPE_A: ${{ vars.OAUTH_SCOPE_A }}
          OAUTH_CLIENT_NAME_B: ${{ vars.OAUTH_CLIENT_NAME_B }}
          OAUTH_CLIENT_ID_B: ${{ vars.OAUTH_CLIENT_ID_B }}
          OAUTH_CLIENT_SECRET_B: ${{ secrets.OAUTH_CLIENT_SECRET_B }}
          OAUTH_SCOPE_B: ${{ vars.OAUTH_SCOPE_B }}
          TOKEN_CACHE_PATH: ${{ vars.TOKEN_CACHE_PATH || '.cache/token_cache.json' }}
          LOG_CONSOLE_LEVEL: ${{ vars.LOG_CONSOLE_LEVEL || 'INFO' }}
          LOG_FILE_LEVEL: ${{ vars.LOG_FILE_LEVEL || 'DEBUG' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'UTC' }}
          HTTP_TIMEOUT_SECONDS: ${{ vars.HTTP_TIMEOUT_SECONDS }}
          PLAYWRIGHT_LAUNCH_ARGS: ${{ vars.PLAYWRIGHT_LAUNCH_ARGS }}
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: |
          case "$SUITE" in
            all) expression="not quarantine" ;;
            custom)
              if [[ -z "$MARKER" ]]; then
                echo "::error::suite=custom requires a marker expression."
                exit 1
              fi
              expression="($MARKER) and not quarantine" ;;
            *) expression="$SUITE and not quarantine" ;;
          esac
          args=("$TARGET" -n "$WORKERS" -m "$expression" --reruns "$RERUNS" --reruns-delay 2
                --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html
                --traceability-report reports/traceability.md)
          echo "pytest ${args[*]}"
          TEST_SUMMARY_TITLE="E2E $SUITE on $ENVIRONMENT ($BROWSER)" poetry run pytest "${args[@]}"

      - name: Run quarantined tests (non-blocking)
        if: always()
        continue-on-error: true
        env: *framework-settings
        run: |
          if ! poetry run pytest "$TARGET" -m quarantine --collect-only -q > /dev/null 2>&1; then
            echo "No quarantined tests."
            exit 0
          fi
          TEST_SUMMARY_TITLE="Quarantined tests, non-blocking ($BROWSER)" poetry run pytest "$TARGET" -m quarantine \
            --junitxml=reports/quarantine-junit.xml

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.browser }}-${{ github.run_number }}
          path: |
            reports/
            .artifacts/
            !.artifacts/**/*_trace.zip
          include-hidden-files: true
          retention-days: 14

      # Traces exist only for failed UI tests; API-only failures upload nothing.
      - name: Upload Playwright traces
        id: traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.browser }}-${{ github.run_number }}
          path: .artifacts/**/*_trace.zip
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Link traces in job summary
        if: failure() && steps.traces.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.traces.outputs.artifact-url }}
        run: |
          {
            echo "#### Playwright traces"
            echo "[Download traces]($ARTIFACT_URL), unzip, then open a \`*_trace.zip\` at https://trace.playwright.dev or with \`poetry run playwright show-trace <zip>\`."
            echo "Failed tests with a trace:"
            find .artifacts -name '*_trace.zip' | sed -E 's|^\.artifacts/[^/]+/([^/]+)/.*|- `\1`|' | sort -u
          } >> "$GITHUB_STEP_SUMMARY"

  publish-history:
    name: Publish report history (GitHub Pages)
    needs: e2e
    if: always() && inputs.publish_history && (needs.e2e.result == 'success' || needs.e2e.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      SUITE: ${{ inputs.suite || 'regression' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-*-${{ github.run_number }}
          path: downloaded

      - name: Check out gh-pages (created on first use)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages > /dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$remote" site
          else
            git init --quiet -b gh-pages site
            git -C site remote add origin "$remote"
          fi

      - name: Update history
        run: |
          for dir in downloaded/e2e-*; do
            browser=$(basename "$dir" | sed -E 's/^e2e-(.+)-[0-9]+$/\1/')
            [[ -f "$dir/reports/junit.xml" ]] || { echo "::warning::No JUnit report for $browser"; continue; }
            python3 -m tools.report_history --site site --junit "$dir/reports/junit.xml" \
              --report "$dir/reports/report.html" --run-number "$RUN_NUMBER" --run-url "$RUN_URL" \
              --suite "$SUITE" --browser "$browser" --repository "$GITHUB_REPOSITORY"
          done

      - name: Push to gh-pages
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet -m "Report history: run ${RUN_NUMBER}"
          git push --quiet origin gh-pages
          owner="${GITHUB_REPOSITORY%%/*}"
          echo "Report history: https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
