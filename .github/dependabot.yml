version: 2
updates:
  - package-ecosystem: pip # reads pyproject.toml and poetry.lock
    directory: /
    schedule:
      interval: monthly
    # Let new releases age a week before adopting them (supply-chain safety).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
