version: 2
updates:
  - package-ecosystem: pip # reads pyproject.toml and poetry.lock
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
