name: Set up project
description: Install Poetry, Python and project dependencies, and optionally Playwright browsers.

inputs:
  python-version:
    description: Python version to install.
    default: "3.13"
  browsers:
    description: Space-separated Playwright browsers to install with system dependencies (chromium firefox webkit). Empty for none.
    default: ""

runs:
  using: composite
  steps:
    - name: Install Poetry
      shell: bash
      run: pipx install poetry==2.5.1

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: poetry

    - name: Install dependencies
      shell: bash
      run: poetry install --no-interaction

    - name: Install Playwright browsers
      if: inputs.browsers != ''
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        read -ra browser_list <<< "$BROWSERS"
        poetry run playwright install --with-deps "${browser_list[@]}"
