name: Set up project
description: Install Poetry, Python and project dependencies (optionally the Playwright browser).

inputs:
  python-version:
    description: Python version to install.
    default: "3.13"
  browsers:
    description: Install Playwright Chromium and its system dependencies ("true"/"false").
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Poetry
      shell: bash
      run: pipx install poetry==2.5.1

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: poetry

    - name: Install dependencies
      shell: bash
      run: poetry install --no-interaction

    - name: Install Playwright Chromium
      if: inputs.browsers == 'true'
      shell: bash
      run: poetry run playwright install --with-deps chromium
