[tool.poetry]
name = "new-test-framework"
version = "0.1.0"
description = "Hybrid API/UI test framework"
authors = ["Denys Zatkhei"]
readme = "README.md"
packages = [
  { include = "core" },
  { include = "adapters" },
  { include = "domain" }
]

[tool.poetry.dependencies]
python = "^3.11"
pytest = "^9.0.2"
pytest-xdist = "^3.6.1"
python-dotenv = "^1.0.1"
filelock = "^3.15.4"
httpx = "^0.28.1"
playwright = "^1.49.0"
poetry-core = ">=1.8.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.9"
pre-commit = "^3.7.1"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "W",  # pycodestyle warnings
  "I",  # isort
  "B",  # flake8-bugbear
  "UP", # pyupgrade
  "N",  # pep8-naming
]
ignore = [
  "E203",
  "E266",
  "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
