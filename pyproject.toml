[tool.poetry]
name = "new-test-framework"
version = "0.1.0"
description = "Hybrid API/UI test framework"
authors = ["Denys Zatkhei"]
readme = "README.md"
packages = [
  { include = "core" },
  { include = "adapters" },
  { include = "domain" }
]

[tool.poetry.dependencies]
python = "^3.11"
pytest = "^9.1.1"
pytest-xdist = "^3.8.0"
python-dotenv = "^1.2.4"
filelock = "^4.0.12"
httpx = "^0.28.1"
playwright = "^1.63.0"
pytest-html = "^4.2.0"
pydantic = "^2.13.5"
pytest-rerunfailures = "^16.7"
axe-playwright-python = "^0.1.8"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.10"
pre-commit = "^4.6.2"
poethepoet = "^0.48.0"
mypy = "^2.4.0"
pytest-cov = "^7.1.0"
hypothesis = "^6.168.5"
mutmut = "^3.8.0"
pip-audit = "^2.10.1"
zizmor = "^1.30.1"

# Run with `poetry run poe <task>`; extra args are forwarded, e.g. `poe test-api --env-file .env.dev -k identity`.
[tool.poe.tasks]
# Project setup (run `poetry install` first)
install-browsers = { cmd = "playwright install chromium", help = "Install the Playwright Chromium browser" }
install-all-browsers = { cmd = "playwright install chromium firefox webkit", help = "Install all Playwright browsers" }
install-hooks = { cmd = "pre-commit install", help = "Install git pre-commit hooks" }
setup = { sequence = ["install-browsers", "install-hooks"], help = "Install browsers and git hooks" }

# Test sets
test = { cmd = "pytest", help = "Run unit and end-to-end tests" }
test-unit = { cmd = "pytest tests/unit --cov", help = "Run framework unit tests with coverage (no env file needed)" }
test-e2e = { cmd = "pytest test_scripts", help = "Run all end-to-end tests" }
test-smoke = { cmd = "pytest test_scripts -m smoke", help = "Run the smoke suite" }
test-regression = { cmd = "pytest test_scripts -m regression -n auto", help = "Run the regression suite in parallel" }
test-api = { cmd = "pytest test_scripts -m api", help = "Run API tests" }
test-ui = { cmd = "pytest test_scripts -m ui", help = "Run UI tests" }
test-parallel = { cmd = "pytest test_scripts -n auto", help = "Run all end-to-end tests in parallel (pytest-xdist)" }
test-api-parallel = { cmd = "pytest test_scripts -m api -n auto", help = "Run API tests in parallel" }
test-ui-parallel = { cmd = "pytest test_scripts -m ui -n auto", help = "Run UI tests in parallel" }

# Code quality
lint = { cmd = "ruff check .", help = "Lint with ruff" }
format = { cmd = "ruff format .", help = "Format with ruff" }
typecheck = { cmd = "mypy", help = "Type-check with mypy" }
traceability = { cmd = "pytest test_scripts --collect-only -q --require-full-traceability", help = "Every requirement has a test and every e2e test has a known scenario" }
check = { sequence = ["lint", { cmd = "ruff format --check ." }, "typecheck", "traceability"], help = "Lint, format check, type-check, traceability" }
mutation = { shell = "mutmut run --max-children 4; mutmut export-cicd-stats && python -m tools.mutation_score --min-score 80", help = "Mutation-test core/ and enforce the minimum score" }
audit = { cmd = "pip-audit --skip-editable", help = "Check installed dependencies for known vulnerabilities" }
lint-workflows = { cmd = "zizmor .github", help = "Security-lint GitHub workflows (zizmor)" }
show-trace = { cmd = "playwright show-trace --host 0.0.0.0 --port 9323", help = "Open a Playwright trace in the browser-based viewer (port 9323)" }

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests", "test_scripts"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
xfail_strict = true
requirements_catalog = "test_scripts/data/requirements.json"
markers = [
  "api: API test",
  "ui: UI test (Playwright)",
  "hybrid: API and UI in one test",
  "contract: response validated against a schema/model",
  "security: authentication/authorization negative test",
  "network: UI test with mocked or faulty network",
  "a11y: accessibility scan",
  "smoke: fast critical-path check, safe to run on every deploy",
  "regression: part of the full regression suite",
  "scenario(id): requirement id from test_scripts/data/requirements.json (required for e2e tests)",
  "quarantine(reason): known-flaky test, runs outside the blocking gate; reason must link an issue",
]

[tool.mutmut]
source_paths = ["core/"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
also_copy = ["conftest.py", "pyproject.toml", "adapters/", "tools/"]

[tool.coverage.run]
# Unit-test scope; domain/ and the Playwright adapter are exercised by the e2e suites.
source = ["core", "adapters"]
omit = ["adapters/playwright_adapter.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.mypy]
python_version = "3.11"
files = ["conftest.py", "core", "adapters", "domain", "test_scripts", "tests", "tools"]
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pytest_html", "axe_playwright_python.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "W",  # pycodestyle warnings
  "I",  # isort
  "B",  # flake8-bugbear
  "UP", # pyupgrade
  "N",  # pep8-naming
]
ignore = [
  "E203",
  "E266",
  "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
